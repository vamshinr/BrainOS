# One-command stack for a new machine:  docker compose up --build
# Brings up Neo4j + Qdrant + the Mnemosyne API together (no manual installs,
# no Neo4j password dance). Pass your key:  ANTHROPIC_API_KEY=sk-ant-... docker compose up
name: mnemosyne

services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/mnemosyne123
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
    # Uncomment to open the Neo4j browser on the host (may clash with a native Neo4j).
    # ports:
    #   - "7475:7474"
    #   - "7688:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p mnemosyne123 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: mnemosyne123
      NEO4J_DATABASE: neo4j
      NEO4J_EVENT_LABEL: MnemosyneEvent
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: mnemosyne_events
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      EXTRACTION_MODEL: claude-haiku-4-5-20251001
      JUDGMENT_MODEL: claude-haiku-4-5-20251001
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PORT: 8090
    ports:
      - "8090:8090"
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  neo4j_data:
  qdrant_data:
