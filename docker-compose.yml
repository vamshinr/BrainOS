# Full BrainOS stack — one command brings up everything:
#
#   ANTHROPIC_API_KEY=sk-ant-... docker compose up --build
#   (or put the key in the root .env, which compose reads automatically)
#
# Services:
#   neo4j      causal graph store        (7474 browser / 7687 bolt)
#   qdrant     vector store              (6333)
#   mnemosyne  causal memory engine API  (8090)   <- the backend
#   frontend   Next.js UI                (3000)   -> talks to mnemosyne
#   nginx      reverse proxy             (80 / 443)
name: brainos

services:
  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/mnemosyne123
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "7474:7474"   # browser  (clashes with a native Neo4j — change if needed)
      - "7687:7687"   # bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p mnemosyne123 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - "6333:6333"   # clashes with a native Qdrant — change if needed
    volumes:
      - qdrant_data:/qdrant/storage

  mnemosyne:
    build:
      context: ./mnemosyne
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: mnemosyne123
      NEO4J_DATABASE: neo4j
      NEO4J_EVENT_LABEL: MnemosyneEvent
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: mnemosyne_events
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      EXTRACTION_MODEL: claude-haiku-4-5-20251001
      JUDGMENT_MODEL: claude-haiku-4-5-20251001
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      PORT: 8090
    ports:
      - "8090:8090"
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://mnemosyne:8090
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      mnemosyne:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs
      - certbot_webroot:/var/www/certbot
    # On first boot, auto-generate a self-signed cert if ./certs is empty.
    command: >
      sh -c "if [ ! -s /etc/nginx/certs/fullchain.pem ]; then
        apk add --no-cache openssl >/dev/null &&
        openssl req -x509 -nodes -newkey rsa:2048 -days 365
          -keyout /etc/nginx/certs/privkey.pem
          -out /etc/nginx/certs/fullchain.pem
          -subj '/CN=brainos.local' &&
        chmod 600 /etc/nginx/certs/privkey.pem;
      fi &&
      nginx -g 'daemon off;'"
    depends_on:
      - frontend

volumes:
  certbot_webroot:
  neo4j_data:
  qdrant_data:
